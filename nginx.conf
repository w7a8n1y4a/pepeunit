# main.dart.js, canvaskit and assets keep a stable path. Immutable caching is
# safe only after docker/stamp-main-js.sh has put a content hash in ?v=.
# A request without that stamp must revalidate, or the previous deploy stays.
map $arg_v $static_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location ~ ^/(main\.dart\.js|canvaskit/.*|assets/.*)$ {
        add_header Cache-Control $static_cache_control;
    }

    # index.html, flutter_bootstrap.js, flutter.js, version.json,
    # instance-config.json and manifest.json decide what to load next,
    # so they always come back for a check.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
