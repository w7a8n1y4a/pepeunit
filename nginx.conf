server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # The bootstrap loads these with a ?v= stamp from version.json, so a
    # new build changes the URL and the old cache can stay a year.
    location ~ ^/(main\.dart\.js|canvaskit/.*|assets/.*)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html, flutter_bootstrap.js, flutter.js, version.json,
    # instance-config.json and manifest.json decide what to load next,
    # so they always come back for a check.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
