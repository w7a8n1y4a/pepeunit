variables:
  DOCKER_IMAGE_TAG: $CI_PIPELINE_IID
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG

# BuildKit is a Go binary. Go 1.24+ offers X25519MLKEM768 in the ClientHello,
# and on this network the handshake to auth.docker.io times out. The setting
# applies only at `buildx create`, so an existing builder is recreated once.
.ensure_multiarch_builder:
  script:
    - |
      BUILDER=multiarch-builder
      CONTAINER="buildx_buildkit_${BUILDER}0"
      if docker buildx inspect "$BUILDER" >/dev/null 2>&1 \
        && docker inspect "$CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -qx 'GODEBUG=tlsmlkem=0'; then
        docker buildx use "$BUILDER"
      else
        docker buildx rm -f "$BUILDER" >/dev/null 2>&1 || true
        docker buildx create --use --name "$BUILDER" --driver docker-container --driver-opt env.GODEBUG=tlsmlkem=0
      fi

.trivy:
  variables:
    TRIVY_IMAGE: aquasec/trivy:0.76.2
    TRIVY_SEVERITY_GATE: MEDIUM,HIGH,CRITICAL
  tags:
    - shell-build-runer
  resource_group: trivy-cache
  before_script:
    - mkdir -p "$HOME/.cache/trivy"
    - |
      trivy() {
        docker run --rm --user "$(id -u):$(id -g)" \
          -e TRIVY_CACHE_DIR=/cache \
          -e TRIVY_NO_PROGRESS=true \
          -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY \
          -e TRIVY_USERNAME -e TRIVY_PASSWORD \
          -v "$HOME/.cache/trivy:/cache" \
          -v "$CI_PROJECT_DIR:/src" -w /src \
          "$TRIVY_IMAGE" "$@"
      }

.osv:
  variables:
    OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.0
  tags:
    - shell-build-runer
  before_script:
    - |
      osv_scanner() {
        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$CI_PROJECT_DIR:/src" -w /src \
          "$OSV_IMAGE" "$@"
      }

.semgrep:
  variables:
    SEMGREP_IMAGE: semgrep/semgrep:1.184.0
    SEMGREP_SEVERITY_GATE: ERROR
    SEMGREP_EXCLUDES: >-
      --exclude build --exclude .dart_tool --exclude .git
      --exclude node_modules --exclude docs
  tags:
    - shell-build-runer
  before_script:
    - |
      semgrep() {
        docker run --rm --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e SEMGREP_ENABLE_VERSION_CHECK=0 \
          -e SEMGREP_SEND_METRICS=off \
          -v "$CI_PROJECT_DIR:/src" -w /src \
          "$SEMGREP_IMAGE" semgrep "$@"
      }

stages:
  - build
  - security
  - deploy_dev
  - tag

security:trivy_repo:
  extends: .trivy
  stage: security
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    - >
      trivy fs
      --scanners vuln,secret,misconfig
      --detection-priority comprehensive
      --skip-dirs build,.dart_tool,.git
      --format json --output trivy-repo.json
      --exit-code 0 .
    - >
      trivy fs
      --scanners vuln,secret,misconfig
      --detection-priority comprehensive
      --dependency-tree
      --skip-dirs build,.dart_tool,.git
      --severity "$TRIVY_SEVERITY_GATE"
      --exit-code 1 .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-repo.json

security:osv_repo:
  extends: .osv
  stage: security
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    - osv_scanner scan source -L pubspec.lock --format json --output-file osv-repo.json || true
    - osv_scanner scan source -L pubspec.lock
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - osv-repo.json

security:semgrep_repo:
  extends: .semgrep
  stage: security
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    - >
      semgrep scan
      --config p/secrets --config .semgrep/
      --metrics=off --no-git-ignore $SEMGREP_EXCLUDES
      --json-output semgrep-repo.json --quiet . || true
    - >
      semgrep scan
      --config p/secrets --config .semgrep/
      --metrics=off --no-git-ignore $SEMGREP_EXCLUDES
      --severity "$SEMGREP_SEVERITY_GATE" --error .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - semgrep-repo.json

security:trivy_image:
  extends: .trivy
  stage: security
  needs: ["build:image:master"]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  script:
    - export TRIVY_USERNAME=$CI_REGISTRY_USER_MAIN TRIVY_PASSWORD=$CI_ACCESS_TOKEN
    - >
      trivy image
      --scanners vuln,secret
      --detection-priority comprehensive
      --format json --output trivy-image.json
      --exit-code 0 "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - >
      trivy image
      --scanners vuln,secret
      --detection-priority comprehensive
      --dependency-tree
      --ignore-unfixed
      --severity "$TRIVY_SEVERITY_GATE"
      --exit-code 1 "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-image.json

build:image:master:
  stage: build
  tags:
    - shell-build-runer
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER_MAIN -p $CI_ACCESS_TOKEN $CI_REGISTRY
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    - docker buildx create --name multiarch-builder --use || docker buildx use multiarch-builder
    - docker buildx inspect --bootstrap
  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG --push .

deploy_dev:image:master:
  stage: deploy_dev
  tags:
    - shell-runer
  variables:
    PROJ: pu-web-dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER_MAIN -p $CI_ACCESS_TOKEN $CI_REGISTRY
  script:
    - docker pull $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker stop pu-spa-dev || echo $?
    - docker rm pu-spa-dev || echo $?
    - docker stop $PROJ || echo $?
    - docker rm $PROJ || echo $?
    - docker run -d --name=$PROJ -p 5501:80 --restart=always $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker system prune -a -f

# A git tag publishes the web client image to Docker Hub and writes a release.
tag:
  stage: tag
  tags:
    - shell-main-pc
  variables:
    HUB_IMAGE: w7a8n1y4a/pepeunit-client
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - !reference [.ensure_multiarch_builder, script]
    - docker buildx inspect --bootstrap
  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false -t $HUB_IMAGE:$CI_COMMIT_TAG --push .
    - >
      curl --silent --show-error --fail-with-body
      --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      --header "PRIVATE-TOKEN: $CI_ACCESS_TOKEN"
      --data-urlencode "name=Release Tag - $CI_COMMIT_TAG"
      --data-urlencode "tag_name=$CI_COMMIT_TAG"
      --data-urlencode "description=All builds on [Docker Hub](https://hub.docker.com/r/$HUB_IMAGE/tags) - $CI_COMMIT_TAG"
