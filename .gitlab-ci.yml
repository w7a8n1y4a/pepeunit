variables:
  DOCKER_IMAGE_TAG: $CI_PIPELINE_IID
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG

# Trivy: pinned version, DB cache lives on the runner host in $HOME/.cache/trivy.
# If ghcr.io is unreachable from the runner, set TRIVY_DB_REPOSITORY and
# TRIVY_JAVA_DB_REPOSITORY (CI/CD variables) to a mirror.
.trivy:
  variables:
    TRIVY_IMAGE: aquasec/trivy:0.76.2
    # Strict mode: gate on MEDIUM and above, unfixed CVEs included
    # (no --ignore-unfixed), comprehensive detection (also reports CVEs that
    # the distro vendor has not confirmed / marked as affected yet).
    TRIVY_SEVERITY_GATE: MEDIUM,HIGH,CRITICAL
  tags:
    - shell-build-runer
  # The shared on-host cache (trivy.db is mmap'ed by bbolt) must never be
  # updated while another Trivy reads it, otherwise: "SIGBUS: bus error".
  # resource_group serializes all Trivy jobs across pipelines.
  resource_group: trivy-cache
  before_script:
    - mkdir -p "$HOME/.cache/trivy"
    - |
      trivy() {
        docker run --rm --user "$(id -u):$(id -g)" \
          -e TRIVY_CACHE_DIR=/cache \
          -e TRIVY_NO_PROGRESS=true \
          -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY \
          -e TRIVY_USERNAME -e TRIVY_PASSWORD \
          -v "$HOME/.cache/trivy:/cache" \
          -v "$CI_PROJECT_DIR:/src" -w /src \
          "$TRIVY_IMAGE" "$@"
      }

# OSV-Scanner: pinned version. Queries api.osv.dev for every package in
# pubspec.lock. Its pub data is broader than Trivy's, so the two scanners
# complement each other.
.osv:
  variables:
    OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.0
  tags:
    - shell-build-runer
  before_script:
    - |
      osv_scanner() {
        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$CI_PROJECT_DIR:/src" -w /src \
          "$OSV_IMAGE" "$@"
      }

stages:
  - build
  - security
  - deploy_dev

# Whole repo: Dart deps (pubspec.lock), Dockerfile misconfigurations,
# hardcoded secrets.
security:trivy_repo:
  extends: .trivy
  stage: security
  needs: []
  # Findings turn the job orange (warning) but do not block the pipeline.
  # Remove allow_failure to make the scan blocking again.
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    # 1) full report (all severities, incl. LOW/UNKNOWN), never fails; artifact
    - >
      trivy fs
      --scanners vuln,secret,misconfig
      --detection-priority comprehensive
      --skip-dirs build,.dart_tool,.git
      --format json --output trivy-repo.json
      --exit-code 0 .
    # 2) readable log + gate: fail on MEDIUM+ (fixed and unfixed)
    - >
      trivy fs
      --scanners vuln,secret,misconfig
      --detection-priority comprehensive
      --dependency-tree
      --skip-dirs build,.dart_tool,.git
      --severity "$TRIVY_SEVERITY_GATE"
      --exit-code 1 .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-repo.json

# Dart deps (pubspec.lock) against the OSV database.
security:osv_repo:
  extends: .osv
  stage: security
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    # 1) full report as an artifact, never fails
    - osv_scanner scan source -L pubspec.lock --format json --output-file osv-repo.json || true
    # 2) readable log + gate: exit code 1 on any finding
    - osv_scanner scan source -L pubspec.lock
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - osv-repo.json

# Final image: OS packages of nginx:alpine + the web build.
security:trivy_image:
  extends: .trivy
  stage: security
  needs: ["build:image:master"]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  script:
    - export TRIVY_USERNAME=$CI_REGISTRY_USER_MAIN TRIVY_PASSWORD=$CI_ACCESS_TOKEN
    - >
      trivy image
      --scanners vuln,secret
      --detection-priority comprehensive
      --format json --output trivy-image.json
      --exit-code 0 "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - >
      trivy image
      --scanners vuln,secret
      --detection-priority comprehensive
      --dependency-tree
      --ignore-unfixed
      --severity "$TRIVY_SEVERITY_GATE"
      --exit-code 1 "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-image.json

build:image:master:
  stage: build
  tags:
    - shell-build-runer
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER_MAIN -p $CI_ACCESS_TOKEN $CI_REGISTRY
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    - docker buildx create --name multiarch-builder --use || docker buildx use multiarch-builder
    - docker buildx inspect --bootstrap
  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG --push .

deploy_dev:image:master:
  stage: deploy_dev
  tags:
    - shell-runer
  variables:
    PROJ: pu-web-dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER_MAIN -p $CI_ACCESS_TOKEN $CI_REGISTRY
  script:
    - docker pull $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker stop pu-spa-dev || echo $?
    - docker rm pu-spa-dev || echo $?
    - docker stop $PROJ || echo $?
    - docker rm $PROJ || echo $?
    - docker run -d --name=$PROJ -p 5501:80 --restart=always $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker system prune -a -f
