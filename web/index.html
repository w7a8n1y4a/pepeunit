<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pepeunit">
  <meta name="theme-color" content="#1B1B1F">
  <meta name="color-scheme" content="dark">
  <style>
    @font-face {
      font-family: "OpenGost Type B";
      src: url("assets/assets/fonts/OpenGostTypeB-Regular.ttf") format("truetype");
      font-display: swap;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #1B1B1F;
      color-scheme: dark;
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      background: #1B1B1F;
      transition: opacity 180ms linear;
    }

    #boot.boot-hide {
      opacity: 0;
      pointer-events: none;
    }

    #boot svg {
      width: min(46vmin, 280px);
      height: auto;
    }

    #boot .wait {
      transform-box: fill-box;
      transform-origin: center;
      animation: boot-spin 1.1s linear infinite;
    }

    #boot-track,
    #boot-meter,
    #boot-pct {
      display: none;
    }

    #boot.boot-known .wait {
      display: none;
    }

    #boot.boot-known #boot-track,
    #boot.boot-known #boot-meter,
    #boot.boot-known #boot-pct {
      display: block;
    }

    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot { transition: none; }
      #boot .wait { animation: none; }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pepeunit_client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pepeunit</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="загрузка">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <polygon
        points="120,20 206.603,70 206.603,170 120,220 33.397,170 33.397,70"
        fill="#14161B"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linejoin="miter"
      />
      <g class="wait" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
        <circle cx="120" cy="120" r="48.55" stroke-dasharray="63.05 38.64" />
      </g>
      <circle id="boot-track" cx="120" cy="120" r="48.55" fill="none" stroke="#A1A1AA" stroke-opacity="0.45" stroke-width="3" />
      <circle id="boot-meter" cx="120" cy="120" r="48.55" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" transform="rotate(-90 120 120)" />
      <text id="boot-pct" x="120" y="120" fill="#FFFFFF" font-family="OpenGost Type B, sans-serif" font-size="28" text-anchor="middle" dominant-baseline="central"></text>
      <path id="boot-edge" fill="none" d="M45.73 81.36 L115.67 40.98" />
      <text
        fill="#FFFFFF"
        font-family="OpenGost Type B, sans-serif"
        font-size="19"
        text-anchor="middle"
        dominant-baseline="central"
      >
        <textPath id="boot-label" href="#boot-edge" startOffset="50%">загрузка</textPath>
      </text>
    </svg>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var label = document.getElementById('boot-label');
      var meter = document.getElementById('boot-meter');
      var pctText = document.getElementById('boot-pct');
      var language = (navigator.language || 'ru').toLowerCase();
      if (boot && label && language.indexOf('en') === 0) {
        label.textContent = 'loading';
        boot.setAttribute('aria-label', 'loading');
      }

      var radius = Number(meter.getAttribute('r'));
      var ring = 2 * Math.PI * radius;
      meter.setAttribute('stroke-dasharray', String(ring));
      meter.setAttribute('stroke-dashoffset', String(ring));

      // Release bundles are static files with a length. The dev server
      // compiles on the fly and reports no total, so it keeps the spinner.
      var parts = {};
      function releaseBuild() {
        var builds = window._flutter && window._flutter.buildConfig && window._flutter.buildConfig.builds;
        if (!builds) return false;
        for (var i = 0; i < builds.length; i++) {
          if (builds[i].compileTarget && builds[i].compileTarget !== 'dartdevc') return true;
        }
        return false;
      }
      function paint() {
        var urls = Object.keys(parts);
        if (!urls.length) return;
        var loaded = 0;
        var total = 0;
        for (var i = 0; i < urls.length; i++) {
          var part = parts[urls[i]];
          if (!part.total) return;
          loaded += part.loaded;
          total += part.total;
        }
        var pct = loaded >= total ? 100 : Math.floor(loaded * 100 / total);
        boot.classList.add('boot-known');
        meter.setAttribute('stroke-dashoffset', String(ring * (1 - pct / 100)));
        pctText.textContent = pct + '%';
        boot.setAttribute('aria-valuenow', String(pct));
        boot.setAttribute('aria-valuetext', pct + '%');
      }
      function note(url, loaded, total) {
        parts[url] = { loaded: loaded, total: total > 0 ? total : 0 };
        paint();
      }
      function forget(url) {
        delete parts[url];
        paint();
      }

      var jobs = {};
      function fetchBytes(url) {
        if (jobs[url]) return jobs[url];
        jobs[url] = new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', url);
          xhr.responseType = 'arraybuffer';
          xhr.onprogress = function (event) {
            note(url, event.loaded, event.lengthComputable ? event.total : 0);
          };
          xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
              // Progress events report the compressed length. The decoded
              // buffer is larger, so the finished file keeps the length
              // the bar was already using.
              var known = parts[url] && parts[url].total;
              var size = known || xhr.response.byteLength;
              note(url, size, size);
              resolve(xhr.response);
            } else {
              forget(url);
              reject(new Error('load'));
            }
          };
          xhr.onerror = function () {
            forget(url);
            reject(new Error('network'));
          };
          xhr.send();
        });
        return jobs[url];
      }

      var headAppend = document.head.append;
      var headAppendChild = document.head.appendChild;
      function bundleScript(node) {
        if (!node || node.nodeName !== 'SCRIPT' || !releaseBuild()) return false;
        var src;
        try {
          src = new URL(node.src, document.baseURI);
        } catch (error) {
          return false;
        }
        if (!src.pathname.endsWith('/main.dart.js')) return false;
        var url = src.href;
        fetchBytes(url).then(function (buf) {
          node.src = URL.createObjectURL(new Blob([buf], { type: 'text/javascript' }));
          headAppend.call(document.head, node);
        }, function () {
          headAppend.call(document.head, node);
        });
        return true;
      }
      document.head.append = function () {
        if (arguments.length === 1 && bundleScript(arguments[0])) return;
        return headAppend.apply(document.head, arguments);
      };
      document.head.appendChild = function (node) {
        if (bundleScript(node)) return node;
        return headAppendChild.call(document.head, node);
      };

      function wasmUrl(input) {
        var url = typeof input === 'string' ? input : input && input.url;
        if (!url || url.indexOf('blob:') === 0 || url.indexOf('data:') === 0) return '';
        try {
          var parsed = new URL(url, document.baseURI);
        } catch (error) {
          return '';
        }
        if (!parsed.pathname.endsWith('.wasm')) return '';
        return parsed.href;
      }
      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var url = wasmUrl(input);
        if (!url || !releaseBuild()) return nativeFetch(input, init);
        return fetchBytes(url).then(function (buf) {
          return new Response(buf, {
            status: 200,
            headers: { 'Content-Type': 'application/wasm' },
          });
        }, function () {
          return nativeFetch(input, init);
        });
      };

      window.addEventListener('flutter-first-frame', function () {
        document.head.append = headAppend;
        document.head.appendChild = headAppendChild;
        window.fetch = nativeFetch;
        if (!boot) return;
        boot.classList.add('boot-hide');
        var remove = function () {
          if (boot.parentNode) boot.remove();
        };
        boot.addEventListener('transitionend', remove);
        setTimeout(remove, 400);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
