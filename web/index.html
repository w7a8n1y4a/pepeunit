  <style>
    @font-face {
      font-family: "OpenGost Type B";
      src: url("assets/assets/fonts/OpenGostTypeB-Regular.ttf") format("truetype");
      font-display: block;
    }

    /* A long press is the tip gesture. Without this, a phone browser takes
       it for a text selection or a context menu and cancels the touch. */
    html, body, flt-glass-pane {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #1B1B1F;
      color-scheme: dark;
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      background: #1B1B1F;
      image-rendering: pixelated;
      transition: opacity 180ms linear;
    }

    #boot.boot-hide {
      opacity: 0;
      pointer-events: none;
    }

    #boot svg {
      width: min(64.4vmin, 392px);
      height: auto;
    }

    #boot-cell-texture {
      image-rendering: pixelated;
    }

    #boot text {
      visibility: hidden;
    }

    #boot.boot-font text {
      visibility: visible;
    }

    #boot .wait {
      transform-box: fill-box;
      transform-origin: center;
      animation: boot-spin 1.1s linear infinite;
    }

    #boot-track,
    #boot-meter,
    #boot-pct {
      display: none;
    }

    #boot.boot-known .wait {
      display: none;
    }

    #boot.boot-known #boot-track,
    #boot.boot-known #boot-meter,
    #boot.boot-known #boot-pct {
      display: block;
    }

    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot { transition: none; }
      #boot .wait { animation: none; }
    }
  </style>

  <!-- iOS meta tags & icons -->

<body>
  <div id="boot" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Загрузка">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <defs>
        <pattern id="boot-cell-grain" patternUnits="userSpaceOnUse" width="256" height="256">
          <rect width="100%" height="100%" fill="#14161B" />
          <image id="boot-cell-texture" width="256" height="256" />
        </pattern>
      </defs>
      <polygon
        points="120,20 206.603,70 206.603,170 120,220 33.397,170 33.397,70"
        fill="url(#boot-cell-grain)"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linejoin="miter"
      />
      <g class="wait" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
        <circle cx="120" cy="120" r="48.55" stroke-dasharray="63.05 38.64" />
      </g>
      <circle id="boot-track" cx="120" cy="120" r="48.55" fill="none" stroke="#A1A1AA" stroke-opacity="0.45" stroke-width="3" />
      <circle id="boot-meter" cx="120" cy="120" r="48.55" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" transform="rotate(-90 120 120)" />
      <text id="boot-pct" x="120" y="120" fill="#FFFFFF" font-family="OpenGost Type B, sans-serif" font-size="28" text-anchor="middle" dominant-baseline="central"></text>
      <path id="boot-edge" fill="none" d="M45.73 81.36 L115.67 40.98" />
      <text
        fill="#FFFFFF"
        font-family="OpenGost Type B, sans-serif"
        font-size="19"
        text-anchor="middle"
        dominant-baseline="central"
      >
        <textPath id="boot-label" href="#boot-edge" startOffset="50%">Загрузка</textPath>
      </text>
    </svg>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var side = 256;

      function grainTile(red, green, blue, spread, seed) {
        var canvas = document.createElement('canvas');
        canvas.width = side;
        canvas.height = side;
        var context = canvas.getContext('2d');
        if (!context) return null;
        var image = context.createImageData(side, side);
        var state = seed;

        function random() {
          state = state + 0x6D2B79F5 | 0;
          var value = state;
          value = Math.imul(value ^ value >>> 15, value | 1);
          value ^= value + Math.imul(value ^ value >>> 7, value | 61);
          return ((value ^ value >>> 14) >>> 0) / 4294967296;
        }
        function bell() {
          return (random() + random() + random() + random() - 2) * Math.sqrt(3);
        }
        function level(center, shared, own) {
          return Math.max(0, Math.min(255, Math.round(center + shared + own)));
        }

        for (var i = 0; i < side * side; i++) {
          var shared = bell() * spread * 0.87;
          var at = i * 4;
          image.data[at] = level(red, shared, bell() * spread * 0.5);
          image.data[at + 1] = level(green, shared, bell() * spread * 0.5);
          image.data[at + 2] = level(blue, shared, bell() * spread * 0.5);
          image.data[at + 3] = 255;
        }
        context.putImageData(image, 0, 0);
        return canvas.toDataURL('image/png');
      }

      var scene = grainTile(0x1B, 0x1B, 0x1F, 5, 11);
      var cell = grainTile(0x14, 0x16, 0x1B, 4, 23);
      var ratio = window.devicePixelRatio || 1;
      var texel = Math.max(1, Math.round(ratio * 0.6));
      var size = side * texel / ratio;
      if (scene) {
        boot.style.backgroundImage = 'url("' + scene + '")';
        boot.style.backgroundSize = size + 'px ' + size + 'px';
      }
      if (cell) {
        var svg = boot.querySelector('svg');
        var units = (svg.clientWidth || 240) / 240;
        var patternSize = size / units;
        var pattern = document.getElementById('boot-cell-grain');
        var texture = document.getElementById('boot-cell-texture');
        pattern.setAttribute('width', String(patternSize));
        pattern.setAttribute('height', String(patternSize));
        texture.setAttribute('width', String(patternSize));
        texture.setAttribute('height', String(patternSize));
        texture.setAttribute('href', cell);
      }
    })();
  </script>
  <script>
    document.addEventListener('contextmenu', function (event) {
      if (event.pointerType === 'touch' || event.sourceCapabilities && event.sourceCapabilities.firesTouchEvents) {
        event.preventDefault();
      }
    });
  </script>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var showBootFont = function () {
        if (boot) boot.classList.add('boot-font');
      };
      if (document.fonts && document.fonts.load) {
        document.fonts.load('19px "OpenGost Type B"').then(showBootFont, showBootFont);
        setTimeout(showBootFont, 1500);
      } else {
        showBootFont();
      }
      var label = document.getElementById('boot-label');
      var meter = document.getElementById('boot-meter');
      var pctText = document.getElementById('boot-pct');
      var language = (navigator.language || 'ru').toLowerCase();
      if (boot && label && language.indexOf('en') === 0) {
        label.textContent = 'Loading';
        boot.setAttribute('aria-label', 'Loading');
      }

      var radius = Number(meter.getAttribute('r'));
      var ring = 2 * Math.PI * radius;
      meter.setAttribute('stroke-dasharray', String(ring));
      meter.setAttribute('stroke-dashoffset', String(ring));

      // The dev build keeps the spinner. A release build fills the arc
      // from the decoded CanvasKit size and leaves it on screen, up to
      // 99, until the first frame. main.dart.js stays a script tag so
      // the browser can parse it while it downloads.
      var parts = {};
      function releaseBuild() {
        var builds = window._flutter && window._flutter.buildConfig && window._flutter.buildConfig.builds;
        if (!builds) return false;
        for (var i = 0; i < builds.length; i++) {
          if (builds[i].compileTarget && builds[i].compileTarget !== 'dartdevc') return true;
        }
        return false;
      }
      function measure() {
        var urls = Object.keys(parts);
        if (!urls.length) return null;
        var loaded = 0;
        var total = 0;
        for (var i = 0; i < urls.length; i++) {
          var part = parts[urls[i]];
          if (!part.total) return null;
          loaded += Math.min(part.loaded, part.total);
          total += part.total;
        }
        if (!total) return null;
        return { loaded: loaded, total: total };
      }
      function paint() {
        var measured = measure();
        if (!measured) return;
        var pct = Math.min(99, Math.floor(measured.loaded * 100 / measured.total));
        boot.classList.add('boot-known');
        meter.setAttribute('stroke-dashoffset', String(ring * (1 - pct / 100)));
        pctText.textContent = pct + '%';
        boot.setAttribute('aria-valuenow', String(pct));
        boot.setAttribute('aria-valuetext', pct + '%');
      }
      function note(url, loaded, total) {
        parts[url] = { loaded: loaded, total: total > 0 ? total : 0 };
        paint();
      }

      var nativeFetch = window.fetch.bind(window);

      function wasmUrl(input) {
        var url = typeof input === 'string' ? input : input && input.url;
        if (!url || url.indexOf('blob:') === 0 || url.indexOf('data:') === 0) return '';
        var parsed;
        try {
          parsed = new URL(url, document.baseURI);
        } catch (error) {
          return '';
        }
        if (!parsed.pathname.endsWith('.wasm')) return '';
        return parsed.href;
      }
      function wasmDecodedSize(url) {
        // Chrome keeps the compressed Content-Length and gives the page the
        // decoded bytes, so the header cannot fill the arc. This is the
        // decoded size of chromium/canvaskit.wasm for the current engine.
        // A different build misses the check and keeps the spinner.
        var revision = window._flutter && window._flutter.buildConfig && window._flutter.buildConfig.engineRevision;
        if (revision === 'deb287481e3ce9468f3434937ced4240a70539ca' &&
            url.indexOf('/chromium/canvaskit.wasm') !== -1) {
          return 5428806;
        }
        return 0;
      }
      window.fetch = function (input, init) {
        var url = wasmUrl(input);
        if (!url || !releaseBuild()) return nativeFetch(input, init);
        return nativeFetch(input, init).then(function (response) {
          var total = wasmDecodedSize(url);
          if (!response.ok || !response.body || !total) return response;
          note(url, 0, total);
          var reader = response.body.getReader();
          var loaded = 0;
          var stream = new ReadableStream({
            pull: function (controller) {
              return reader.read().then(function (result) {
                if (result.done) {
                  note(url, total, total);
                  controller.close();
                  return;
                }
                loaded += result.value.byteLength;
                note(url, loaded >= total ? total - 1 : loaded, total);
                controller.enqueue(result.value);
              });
            },
            cancel: function (reason) {
              return reader.cancel(reason);
            }
          });
          return new Response(stream, {
            status: response.status,
            headers: { 'Content-Type': response.headers.get('Content-Type') || 'application/wasm' }
          });
        });
      };

      window.addEventListener('flutter-first-frame', function () {
        window.fetch = nativeFetch;
        if (!boot) return;
        boot.classList.add('boot-hide');
        var remove = function () {
          if (boot.parentNode) boot.remove();
        };
        boot.addEventListener('transitionend', remove);
        setTimeout(remove, 400);
      });
    })();
  </script>
